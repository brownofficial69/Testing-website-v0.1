<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=null;try{t=localStorage.getItem("sh-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"night":"calm";document.documentElement.setAttribute("data-theme",t)})()</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Career Metro | Shadman Hossain</title>
<meta name="description" content="Shadman Hossain's education, work, security and AI projects as five metro lines. Ride a line, watch the map build through time, or click any station." />
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../transitions.css?v=20261025" />
  <script src="../site-fx.js" defer></script>
  <link rel="stylesheet" href="../theme.css?v=20261025" />
  <link rel="stylesheet" href="../fxpage.css?v=20261025" />
</head>
<body>
<header class="top">
  <img class="me" src="../assets/profile.jpg" alt="Shadman Hossain" width="64" height="80" />
  <div>
    <h1>Career Metro</h1>
    <p>Five lines, one traveller. Where the lines meet is where one piece of work counted twice.</p>
  </div>
  <nav><a href="../versions.html">Gallery</a><a href="../index.html">Main site</a></nav>
</header>

<div class="controls" role="group" aria-label="Map controls">
  <button id="play" type="button" class="primary">Watch it build</button>
  <button id="ride" type="button">Ride a line</button>
  <span class="legend" id="legend" role="group" aria-label="Lines"></span>
  <span class="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">&minus;</button><button id="zfit" type="button">Fit</button></span>
</div>

<main class="map" id="mapWrap">
  <svg id="map" viewBox="0 0 1400 640" role="img" aria-label="Metro map of Shadman Hossain's education, work, security, project and AI history"></svg>
  <div class="tip" id="tip" hidden></div>
  <p class="caption" id="caption" aria-live="polite"></p>
</main>

<section class="card" id="card" hidden aria-live="polite">
  <button class="x" id="close" type="button" aria-label="Close details">&times;</button>
  <p class="k" id="cK"></p>
  <h2 id="cT"></h2>
  <p id="cD"></p>
  <ul class="serves" id="cS"></ul>
  <div class="acts" id="cA"></div>
</section>

<script src="app.js"></script>
<script src="../fx.js?v=20261025"></script>
<script src="../page-fx.js?v=20261025"></script>
</body>
</html>
