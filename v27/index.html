<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=null;try{t=localStorage.getItem("sh-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"night":"calm";document.documentElement.setAttribute("data-theme",t)})()</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Periodic Table of Shadman | Shadman Hossain</title>
<meta name="description" content="Shadman Hossain's skills as a periodic table. Pick elements and the compounds they form, the projects built from them, light up." />
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../transitions.css?v=20261027" />
  <script src="../site-fx.js?v=20261027" defer></script>
  <link rel="stylesheet" href="../theme.css?v=20261025" />
  <link rel="stylesheet" href="../fxpage.css?v=20261028" />
</head>
<body>
<header class="top">
  <img class="me" src="../assets/profile.jpg" alt="Shadman Hossain" width="64" height="80" />
  <div>
    <h1>Periodic Table of Shadman</h1>
    <p>Pick elements to see which of my projects they combine into. Or pick a project and watch its elements bond.</p>
  </div>
  <nav><a href="../versions.html">Gallery</a><a href="../index.html">Main site</a></nav>
</header>

<div class="tools">
  <label class="search"><span class="sr">Search elements</span><input id="q" type="search" placeholder="Search: sigma, go, nist…" autocomplete="off" /></label>
  <div class="cats" id="cats" role="group" aria-label="Filter by family"></div>
  <button id="clear" type="button" class="clear" hidden>Clear bench</button>
</div>

<main class="lab">
  <section class="tablewrap" aria-label="Elements">
    <div class="table" id="table"></div>
    <svg class="bonds" id="bonds" aria-hidden="true"></svg>
  </section>

  <aside class="side">
    <section class="bench" aria-live="polite">
      <h2>Bench</h2>
      <p class="empty" id="benchEmpty">Click elements in the table to add them here.</p>
      <ul id="bench" class="chips"></ul>
    </section>
    <section class="comps">
      <h2>Compounds</h2>
      <ul id="comps"></ul>
    </section>
    <section class="detail" id="detail" hidden aria-live="polite">
      <p class="dk" id="dK"></p>
      <h3 id="dT"></h3>
      <p id="dD"></p>
      <div class="da" id="dA"></div>
    </section>
  </aside>
</main>
<script src="app.js"></script>
<script src="../fx.js?v=20261025"></script>
<script src="../page-fx.js?v=20261028"></script>
</body>
</html>
