<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CyberCity | Shadman Hossain</title>
<meta name="description" content="Shadman Hossain's projects as landmarks in a 3D night city. Orbit it, take the guided tour or fly into any tower." />
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="labels" aria-hidden="true"></div>

<header class="head">
  <img class="me" src="../assets/profile.jpg" alt="Shadman Hossain" width="64" height="80" />
  <div><h1>CyberCity</h1><p>Shadman Hossain's projects, built as a skyline. Six landmarks, one city.</p></div>
</header>

<nav class="bar" aria-label="City controls">
  <button id="tour" type="button" class="primary" aria-pressed="false">Start the tour</button>
  <button id="rain" type="button" aria-pressed="true">Rain</button>
  <a href="../versions.html">Gallery</a>
  <a href="../index.html">Main site</a>
</nav>

<ul class="dir" id="dir" aria-label="Landmarks"></ul>

<section class="card" id="card" hidden aria-live="polite">
  <button class="x" id="close" type="button" aria-label="Close details">&times;</button>
  <p class="k" id="cK"></p>
  <h2 id="cT"></h2>
  <p id="cD"></p>
  <ul class="facts" id="cF"></ul>
  <div class="acts" id="cA"></div>
</section>

<p class="hint" id="hint">Drag to orbit · scroll to zoom · click a glowing tower</p>
<script type="module" src="app.js"></script>
</body>
</html>
