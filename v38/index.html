<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cipher Lab | Shadman Hossain</title>
<meta name="description" content="Break three ciphers the way cryptanalysts did: a Caesar shift, a substitution cipher with frequency analysis, and a Vigenère cipher with the index of coincidence." />
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../labs.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="lab-top">
  <div>
    <h1>Cipher Lab</h1>
    <p class="sub">Three messages, three ciphers. Break them with the same tricks cryptanalysts used, from a ninth-century manuscript to the 1920s.</p>
  </div>
  <nav><a href="../versions.html">Gallery</a><a href="../index.html">Main site</a></nav>
</header>

<main class="lab">
  <section class="stack">
    <div class="box">
      <div class="row tabs" id="tabs" role="tablist" aria-label="Levels"></div>
      <p class="mono lvl" id="lvlName"></p>
      <div class="cipher" id="cipher" aria-label="Ciphertext" role="group"></div>
      <div class="plain" id="plain" aria-live="polite" aria-label="Your decryption"></div>
    </div>

    <div class="box" id="tool"></div>
  </section>

  <aside class="stack">
    <div class="box">
      <h2>Progress</h2>
      <div class="stat"><div><b id="sTime">0:00</b><span>time</span></div><div><b id="sHints">0</b><span>hints used</span></div><div><b id="sSolved">0/3</b><span>solved</span></div></div>
    </div>
    <div class="box learn" id="learn"></div>
  </aside>
</main>
<div class="toast" id="toast" hidden role="status"></div>
<script src="app.js"></script>
</body>
</html>
